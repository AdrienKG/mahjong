<button
  matButton
  class="tile"
  (click)="onClick()"
  [matContextMenuTriggerFor]="contextMenu"
>
  {{ tile() | tileDisplay }}
</button>
<mat-menu #contextMenu>
  <button mat-menu-item (click)="onDiscard()" [disabled]="isUnknown()">Discard</button>
  <button mat-menu-item (click)="onSet()" [disabled]="!isUnknown()">Set</button>
  <button mat-menu-item [disabled]="isUnknown()">Expose</button>
</mat-menu>
