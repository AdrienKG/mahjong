<button
  matButton
  class="tile"
  (click)="tileClicked.emit()"
  [matContextMenuTriggerFor]="contextMenu"
>
  {{ tile() | tileDisplay }}
</button>
<mat-menu #contextMenu>
  <button mat-menu-item (click)="onDiscard()" [disabled]="isUnknown()">
    Discard
  </button>
  <button mat-menu-item (click)="onSet()">Set</button>
  <button mat-menu-item (click)="onToggleExpose()" [disabled]="isUnknown()">
    Expose
  </button>
</mat-menu>
